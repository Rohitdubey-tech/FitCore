name: FITCORE CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  mern-backend-and-frontend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React web bundle
        run: npm run build:web

      - name: Run Express + MongoDB Jest integration tests
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/fitcore_ci_test
        run: npm run test:server

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: pip install -r ai-service/requirements.txt

      - name: Verify FastAPI app & syntax
        run: |
          python -m py_compile ai-service/app/main.py ai-service/app/routes/*.py ai-service/app/services/*.py ai-service/app/validators/*.py
          PYTHONPATH=ai-service python -c "from app.main import app; assert app.title == 'FITCORE AI Service'"
