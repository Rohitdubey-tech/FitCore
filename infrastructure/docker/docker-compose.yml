services:
  mongodb:
    image: mongo:7
    container_name: fitcore-mongodb
    ports:
      - "27017:27017"
    volumes:
      - fitcore_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitcore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: fitcore-ai-service
    ports:
      - "8000:8000"

  server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: fitcore-server
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fitcore
      REDIS_URL: redis://redis:6379
      ENABLE_BULLMQ: "true"
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_with_64_char_production_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace_with_64_char_production_refresh_secret}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: fitcore-web
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  fitcore_mongo_data:
